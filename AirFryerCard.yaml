type: custom:bubble-card
card_type: pop-up
hash: '#fryer'
show_header: false
close_by_clicking_outside: true
button_type: name
styles: |
  #root { 
    border: 1px solid rgba(var(--rgb-primary-text-color),0.1);
     
    }
sub_button:
  main: []
  bottom: []
cards:
  - type: custom:mushroom-chips-card
    chips:
      - type: template
        content: Аэрогриль
        double_tap_action:
          action: none
        tap_action:
          action: none
        hold_action:
          action: none
        icon: material-symbols-light:multicooker
      - type: spacer
      - type: template
        entity: sensor.air_fryer_real_state
        double_tap_action:
          action: none
        tap_action:
          action: more-info
        hold_action:
          action: none
        icon: mdi:information
        card_mod:
          style:
            .: |
              {% set hover = 'true' %}
              {% set stating = 'false' %}
              {% include 'chip_settings_style.jinja' %}
      - type: back
        card_mod:
          style:
            .: |
              {% set hover = 'true' %}
              {% set stating = 'false' %}
              {% include 'chip_settings_style.jinja' %}
    card_mod:
      style:
        mushroom-back-chip:last-child$: |
          ha-state-icon {
            --card-mod-icon: mdi:close;
          }
        .: |
          {% include 'pop_up_title.jinja' %}
    grid_options:
      columns: 12
      rows: auto
  - type: custom:mushroom-template-card
    entity: switch.girlyand_window
    tap_action:
      action: none
    hold_action:
      action: none
    double_tap_action:
      action: none
    icon: >
      {% if is_state('sensor.air_fryer_real_state','Недоступно') %}
      mdi:alert-circle
        {% elif is_state('sensor.air_fryer_real_state','Готовка') %} mdi:gas-burner
        {% elif is_state('sensor.air_fryer_real_state','Завершено') %} mdi:check
        {% elif is_state('sensor.air_fryer_real_state','Корзина открыта') %} mdi:lock-open-variant
        {% elif is_state('sensor.air_fryer_real_state','Режим ожидания') %} mdi:sleep
        {% elif is_state('sensor.air_fryer_real_state','Выключено') %} mdi:power-off
        {% else %}material-symbols-light:multicooker
        {% endif %}
    features_position: bottom
    vertical: true
    icon_tap_action:
      action: none
    grid_options:
      rows: auto
      columns: full
    color: white
    card_mod:
      style: |
        ha-card {
          background: rgba(0,0,0,0.5) !important;
          zoom: 2;
        }
  - type: custom:horizontal-stack-in-card
    cards:
      - type: conditional
        conditions:
          - condition: state
            entity: sensor.xiaomi_ru_917438569_maf65_status_p_2_1
            state_not: Программа выполняется…
          - condition: state
            entity: sensor.xiaomi_ru_917438569_maf65_status_p_2_1
            state_not: Приостановить
          - condition: state
            entity: sensor.xiaomi_ru_917438569_maf65_status_p_2_1
            state_not: Хрустящий гриль
        card:
          type: custom:mushroom-template-card
          features_position: bottom
          entity: button.xiaomi_ru_917438569_maf65_start_cook_a_2_1
          grid_options:
            columns: 12
            rows: auto
          color: white
          tap_action:
            action: toggle
          icon: mdi:play
          vertical: true
          icon_tap_action:
            action: none
          card_mod:
            style: |
              ha-card {
                zoom: 1.5;
                background: none !important; 
              }
      - type: conditional
        conditions:
          - condition: state
            entity: sensor.xiaomi_ru_917438569_maf65_status_p_2_1
            state: Приостановить
        card:
          type: custom:mushroom-template-card
          features_position: bottom
          entity: button.xiaomi_maf65_6f56_resume_cook
          grid_options:
            columns: 12
            rows: auto
          color: white
          tap_action:
            action: toggle
          icon: mdi:play
          vertical: true
          icon_tap_action:
            action: none
          card_mod:
            style: |
              ha-card {
                zoom: 1.5;
                background: none !important;
              }
      - type: conditional
        conditions:
          - condition: state
            entity: sensor.xiaomi_ru_917438569_maf65_status_p_2_1
            state: Программа выполняется…
        card:
          type: custom:mushroom-template-card
          features_position: bottom
          entity: button.xiaomi_ru_917438569_maf65_pause_a_2_3
          grid_options:
            columns: 12
            rows: auto
          color: white
          tap_action:
            action: toggle
          icon: mdi:pause
          vertical: true
          icon_tap_action:
            action: none
          card_mod:
            style: |
              ha-card {
                zoom: 1.5;
                background: none !important;
              }
      - type: conditional
        conditions:
          - condition: or
            conditions:
              - condition: state
                entity: sensor.xiaomi_ru_917438569_maf65_status_p_2_1
                state: Программа выполняется…
              - condition: state
                entity: sensor.xiaomi_ru_917438569_maf65_status_p_2_1
                state: Приостановить
              - condition: state
                entity: sensor.xiaomi_ru_917438569_maf65_status_p_2_1
                state: Хрустящий гриль
              - condition: state
                entity: sensor.xiaomi_ru_917438569_maf65_status_p_2_1
                state: Приостановить путем удаления корзины
        card:
          type: custom:mushroom-template-card
          features_position: bottom
          entity: button.xiaomi_ru_917438569_maf65_cancel_cooking_a_2_2
          grid_options:
            columns: 12
            rows: auto
          color: white
          tap_action:
            action: toggle
          icon: mdi:stop
          vertical: true
          icon_tap_action:
            action: none
          card_mod:
            style: |
              ha-card {
                zoom: 1.5;
                background: none !important;
              }
      - type: custom:mushroom-template-card
        features_position: bottom
        entity: button.xiaomi_ru_917438569_maf65_cancel_cooking_a_2_2
        grid_options:
          columns: 12
          rows: auto
        color: white
        tap_action:
          action: navigate
          navigation_path: '#fryer_settings'
        icon: mdi:dots-horizontal
        vertical: true
        icon_tap_action:
          action: none
        card_mod:
          style: |
            ha-card {
              zoom: 1.5;
              background: none !important;
            }
    visibility:
      - condition: state
        entity: sensor.air_fryer_real_state
        state_not: Недоступно
    card_mod:
      style: |
        ha-card {
         background: none !important;
        }
  - type: custom:mushroom-template-card
    features_position: bottom
    entity: select.xiaomi_ru_917438569_maf65_mode_p_2_8
    grid_options:
      columns: 12
      rows: auto
    tap_action:
      action: toggle
    vertical: true
    icon_tap_action:
      action: none
    features:
      - type: select-options
    card_mod:
      style: |
        ha-card {
          
          background: none !important; 
        }
    visibility:
      - condition: state
        entity: sensor.air_fryer_real_state
        state_not: Недоступно
popup_mode: fit-content
card_layout: large
slide_to_close_distance: '500'
