type: custom:bubble-card
card_type: pop-up
hash: "#fryer"
margin_top_mobile: auto
margin_top_desktop: auto
show_header: false
close_by_clicking_outside: false
backdrop_blur: "5"
bg_blur: "100"
bg_opacity: "50"
button_type: name
styles: |
  #root {
    border: 1px solid rgba(var(--rgb-primary-text-color),0.1);
    background: rgba(255, 255, 255, 0.1);
    }
sub_button:
  main: []
  bottom: []
cards:
  - type: custom:mushroom-chips-card
    chips:
      - type: template
        content: Аэрогриль
        double_tap_action:
          action: none
        tap_action:
          action: none
        hold_action:
          action: none
        icon: material-symbols-light:multicooker
      - type: spacer
      - type: back
        card_mod:
          style:
            .: |
              {% set hover = 'true' %}
              {% set stating = 'false' %}
              {% include 'chip_settings_style.jinja' %}
    card_mod:
      style:
        mushroom-back-chip:nth-child(3)$: |
          ha-state-icon {
            --card-mod-icon: mdi:close;
          }
        .: |
          {% include 'pop_up_title.jinja' %}
    grid_options:
      columns: 12
      rows: auto
  - type: custom:mushroom-chips-card
    chips:
      - type: template
        entity: switch.girlyand_window
        tap_action:
          action: none
        hold_action:
          action: none
        double_tap_action:
          action: none
        icon: >
          {% if is_state('sensor.air_fryer_real_state','Недоступно') %}
          mdi:alert-circle
            {% elif is_state('sensor.air_fryer_real_state','Готовка') %} mdi:gas-burner
            {% elif is_state('sensor.air_fryer_real_state','Завершено') %} mdi:check
            {% elif is_state('sensor.air_fryer_real_state','Корзина открыта') %} mdi:lock-open-variant
            {% elif is_state('sensor.air_fryer_real_state','Режим ожидания') %} mdi:sleep
            {% elif is_state('sensor.air_fryer_real_state','Выключено') %} mdi:power-off
            {% else %}
            {% endif %}
        icon_color: white
        card_mod:
          style:
            .: |
              {% set scale = '1' %}
              {% set hover = 'true' %}
              {% set stating = '1' %}
              {% set state_on = '' %}
              {% set color = 'rgba(120,120,120,0.2)' %}
              {% set hover_color_off = 'rgba(120,120,120,0.2) !important' %}
              {% include 'chip_settings_style.jinja' %}
    alignment: center
    card_mod:
      style:
        .: |
          ha-card {
             --chip-background: none !important;
             --chip-border-radius: 1000px;
             zoom: 6;
             #--chip-height: 200px;
             --chip-spacing: {{chip_spacing|default(0)}}px;
             margin: 2px;
             }
  - type: custom:horizontal-stack-in-card
    cards:
      - type: conditional
        conditions:
          - condition: state
            entity: sensor.xiaomi_ru_917438569_maf65_status_p_2_1
            state_not: Программа выполняется…
          - condition: state
            entity: sensor.xiaomi_ru_917438569_maf65_status_p_2_1
            state_not: Приостановить
          - condition: state
            entity: sensor.xiaomi_ru_917438569_maf65_status_p_2_1
            state_not: Хрустящий гриль
        card:
          type: custom:mushroom-template-card
          features_position: bottom
          entity: button.xiaomi_ru_917438569_maf65_start_cook_a_2_1
          grid_options:
            columns: 12
            rows: auto
          color: white
          tap_action:
            action: toggle
          icon: mdi:play
          vertical: true
          icon_tap_action:
            action: none
          card_mod:
            style: |
              ha-card {
                zoom: 1.5;
                background: none;
              }
      - type: conditional
        conditions:
          - condition: state
            entity: sensor.xiaomi_ru_917438569_maf65_status_p_2_1
            state: Приостановить
        card:
          type: custom:mushroom-template-card
          features_position: bottom
          entity: button.xiaomi_ru_917438569_maf65_start_cook_a_2_1
          grid_options:
            columns: 12
            rows: auto
          color: white
          tap_action:
            action: toggle
          icon: mdi:play
          vertical: true
          icon_tap_action:
            action: none
          card_mod:
            style: |
              ha-card {
                zoom: 1.5;
                background: none;
              }
      - type: conditional
        conditions:
          - condition: state
            entity: sensor.xiaomi_ru_917438569_maf65_status_p_2_1
            state: Программа выполняется…
          - condition: state
            entity: sensor.xiaomi_ru_917438569_maf65_status_p_2_1
            state: Хрустящий гриль
        card:
          type: custom:mushroom-template-card
          features_position: bottom
          entity: button.xiaomi_ru_917438569_maf65_pause_a_2_3
          grid_options:
            columns: 12
            rows: auto
          color: white
          tap_action:
            action: toggle
          icon: mdi:pause
          vertical: true
          icon_tap_action:
            action: none
          card_mod:
            style: |
              ha-card {
                zoom: 1.5;
                background: none;
              }
      - type: conditional
        conditions:
          - condition: or
            conditions:
              - condition: state
                entity: sensor.xiaomi_ru_917438569_maf65_status_p_2_1
                state: Программа выполняется…
              - condition: state
                entity: sensor.xiaomi_ru_917438569_maf65_status_p_2_1
                state: Приостановить
              - condition: state
                entity: sensor.xiaomi_ru_917438569_maf65_status_p_2_1
                state: Хрустящий гриль
              - condition: state
                entity: sensor.xiaomi_ru_917438569_maf65_status_p_2_1
                state: Приостановить путем удаления корзины
        card:
          type: custom:mushroom-template-card
          features_position: bottom
          entity: button.xiaomi_ru_917438569_maf65_cancel_cooking_a_2_2
          grid_options:
            columns: 12
            rows: auto
          color: white
          tap_action:
            action: toggle
          icon: mdi:stop
          vertical: true
          icon_tap_action:
            action: none
          card_mod:
            style: |
              ha-card {
                zoom: 1.5;
                background: none;
              }
    visibility:
      - condition: state
        entity: sensor.air_fryer_real_state
        state_not: Недоступно
    card_mod:
      style: |
        ha-card {
         background: none !important;
        }
popup_mode: default
card_layout: large
slide_to_close_distance: "500"
